# tixforge template: tixforge-ci (v3). A starting point that /tixforge:project init
# fills in with the user: the setup steps depend on the project, the verify
# steps are .tixforge/config.yml `commands` in the same order, so CI and
# /tixforge:dev verify the same things.
name: tixforge-ci

on:
  pull_request:
  push:
    branches: [__BRANCHES__]   # base_branch, and the default branch when it differs (main + develop)

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # __SETUP__ : toolchain and dependencies, e.g.
      #   - uses: actions/setup-node@v4
      #     with: { node-version-file: .nvmrc, cache: npm }
      #   - run: npm ci
      # __COMMANDS__ : one step per `commands` entry, e.g.
      #   - name: test
      #     run: npm test
