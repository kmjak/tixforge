# Notify Discord when a new version reaches the default branch: the version
# change and every PR merged since the previous version. Pushes that do not
# change "version" in .claude-plugin/plugin.json send nothing.
name: discord-release-notify

on:
  push:
    branches: [main]
    paths:
      - .claude-plugin/plugin.json

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0   # the previous version is found in the history
      - name: Build the message
        id: payload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          bash .github/scripts/release-payload.sh "$BEFORE" "$AFTER" > "$RUNNER_TEMP/payload.json"
          if [ -s "$RUNNER_TEMP/payload.json" ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            echo "version unchanged: nothing to send"
          fi
      - name: Notify Discord
        if: steps.payload.outputs.send == 'true'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -sS --fail-with-body -H "Content-Type: application/json" -d @"$RUNNER_TEMP/payload.json" "$WEBHOOK"
