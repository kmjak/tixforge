name: test

# Every push to main and every PR, whatever it changes: the skills, hooks and
# manifests are checked too, and "result" (the required check) always runs.
# push runs only on main: a PR's branch is tested by pull_request. "edited"
# re-checks a PR whose title changed.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PRs are squash-merged and the title becomes the commit release-please
  # reads, so it must be a Conventional Commit (see CLAUDE.md).
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" \
            | grep -Eq '^(feat|fix|perf|refactor|docs|test|ci|build|chore|revert)(\([a-z0-9-]+\))?!?: .+' \
            || { echo "::error::PR title is not a Conventional Commit (e.g. 'fix: ...', 'feat(dev): ...'): $TITLE"; exit 1; }

  # Only on the release PR: the version tag must not exist yet, and
  # plugin.json and the marketplace entry must agree.
  plugin-tag:
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: npm install -g @anthropic-ai/claude-code@2.1.314 # zizmor: ignore[adhoc-packages] the version is fixed
      - run: claude plugin tag --dry-run .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the linters
        run: |
          pipx install shellcheck-py==0.11.0.1
          pipx install zizmor==1.31.1
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/editorconfig-checker/editorconfig-checker/v4/cmd/editorconfig-checker@v4.0.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make lint

  test:
    # One job per suite and shell / awk, in parallel; a failing job does not
    # stop the others. The scripts run in the user's awk and bash: gawk, mawk
    # (the default awk of Debian / Ubuntu), and macOS's own bash 3.2 and BWK
    # awk.
    strategy:
      fail-fast: false
      matrix:
        suite: [guard, scripts, json-get, plugin]
        env: [gawk, mawk, macos]
        include:
          - env: gawk
            os: ubuntu-latest
          - env: mawk
            os: ubuntu-latest
          - env: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Put the awk (and on macOS, /bin/bash) under test first on PATH, so the
      # scripts the tests start use them too.
      - name: Use ${{ matrix.env }}
        env:
          ENV_NAME: ${{ matrix.env }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          if [ "$ENV_NAME" = macos ]; then
            ln -sf /usr/bin/awk "$RUNNER_TEMP/bin/awk"
            ln -sf /bin/bash "$RUNNER_TEMP/bin/bash"
          else
            command -v "$ENV_NAME" > /dev/null \
              || { sudo apt-get update -q && sudo apt-get install -y -q "$ENV_NAME"; }
            ln -sf "$(command -v "$ENV_NAME")" "$RUNNER_TEMP/bin/awk"
          fi
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: |
          command -v awk bash
          bash --version | head -1
      - run: bash tests/${{ matrix.suite }}.test.sh

  # The one check to require in the branch rules: it runs even when a job
  # above fails, and passes only when each one passed or did not apply.
  result:
    if: always()
    needs: [pr-title, plugin-tag, lint, test]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do case "$r" in success | skipped) ;; *) exit 1 ;; esac; done
