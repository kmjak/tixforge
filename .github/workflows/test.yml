name: test

on:
  push:
    paths:
      - "scripts/**"
      - "templates/**"
      - "tests/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "templates/**"
      - "tests/**"
      - ".github/workflows/test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/guard.test.sh
      - run: bash tests/scripts.test.sh
      - run: bash tests/json-get.test.sh
